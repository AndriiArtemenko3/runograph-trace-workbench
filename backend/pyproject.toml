[project]
name = "runograph-backend"
version = "0.3.0a0"
description = "Offline trace ingestion and analysis backend for RunoGraph"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Andrii Artemenko" }]
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # SQLAlchemy's platform marker currently misses macOS' `arm64` spelling.
    # Declare greenlet directly so a frozen Python 3.12 install is reproducible
    # on both Apple Silicon and Linux.
    "greenlet>=3.1",
    "scipy>=1.14",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
